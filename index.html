<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>For Chiqui Baby ❤️</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family: "Arial Rounded MT Bold", Arial, sans-serif;

      background:
        radial-gradient(circle at top, #fff7fb, #ffd6e7);

      display: flex;
      justify-content: center;
      align-items: center;

      overflow: hidden;
    }

    .page {
      text-align: center;
      padding: 30px 20px 60px;
      width: 100%;
      max-width: 430px;
    }

    h1 {
      color: #d94f7d;
      font-size: 34px;
      margin-bottom: 12px;
    }

    .intro {
      color: #a84d6c;
      font-size: 18px;
      margin-bottom: 35px;
    }

    /* BUTTON */

    .surprise-button {
      border: none;

      padding: 17px 30px;

      background: #e85c8c;
      color: white;

      font-size: 19px;
      font-weight: bold;

      border-radius: 30px;

      box-shadow:
        0 8px 20px rgba(180, 55, 100, 0.25);

      cursor: pointer;

      animation: pulse 1.5s infinite;
    }

    /* SURPRISE AREA */

    .surprise {
      display: none;
      margin-top: 30px;
    }

    .surprise.show {
      display: block;

      animation: fadeUp 0.8s ease;
    }

    /* CAT */

    .cat-container {
      height: 180px;

      display: flex;
      justify-content: center;
      align-items: center;

      position: relative;
    }

    .cat {
      width: 150px;
      max-height: 150px;

      object-fit: contain;

      border-radius: 20px;

      animation:
        catBounce 0.7s ease-in-out infinite alternate;

      filter:
        drop-shadow(0 10px 12px rgba(0, 0, 0, 0.15));
    }

    /* CAKE */

    .cake {
      margin: -18px auto 25px;

      width: 240px;
      height: 115px;

      background: #f48fb1;

      border-radius: 20px 20px 28px 28px;

      position: relative;

      box-shadow:
        inset 0 -12px rgba(175, 40, 90, 0.12),
        0 12px 20px rgba(100, 30, 60, 0.12);
    }

    .frosting {
      position: absolute;

      top: 0;

      width: 100%;
      height: 40px;

      background: #fff8fa;

      border-radius: 50%;
    }

    .frosting::after {
      content: "";

      position: absolute;

      width: 35px;
      height: 40px;

      background: #fff8fa;

      border-radius: 0 0 50% 50%;

      top: 18px;
      left: 30px;

      box-shadow:
        65px 4px #fff8fa,
        130px 0 #fff8fa;
    }

    /* TEXT */

    .love {
      font-size: 33px;
      font-weight: bold;

      color: #d6336c;

      margin-top: 18px;

      animation: lovePop 1s ease;
    }

    .message {
      font-size: 21px;
      line-height: 1.5;

      color: #9d4162;

      margin-top: 15px;
    }

    /* HEARTS */

    .heart {
      position: fixed;

      bottom: -50px;

      font-size: 28px;

      animation: hearts 6s linear infinite;

      pointer-events: none;
    }

    .heart:nth-child(1) {
      left: 8%;
      animation-delay: 0s;
    }

    .heart:nth-child(2) {
      left: 25%;
      animation-delay: 1.5s;
    }

    .heart:nth-child(3) {
      left: 48%;
      animation-delay: 3s;
    }

    .heart:nth-child(4) {
      left: 70%;
      animation-delay: 0.7s;
    }

    .heart:nth-child(5) {
      left: 88%;
      animation-delay: 2.2s;
    }

    /* HIDDEN YOUTUBE PLAYER */

    #musicPlayer {
      position: fixed;

      width: 1px;
      height: 1px;

      opacity: 0;

      pointer-events: none;

      bottom: 0;
      left: 0;
    }

    @keyframes hearts {

      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
      }

      20% {
        opacity: 1;
      }

      100% {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
      }
    }

    @keyframes pulse {

      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.06);
      }

      100% {
        transform: scale(1);
      }
    }

    @keyframes fadeUp {

      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes catBounce {

      from {
        transform: translateY(0);
      }

      to {
        transform: translateY(-12px);
      }
    }

    @keyframes lovePop {

      0% {
        transform: scale(0.5);
        opacity: 0;
      }

      70% {
        transform: scale(1.12);
      }

      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

  </style>
</head>

<body>

  <!-- FLOATING HEARTS -->

  <div class="heart">❤️</div>
  <div class="heart">💕</div>
  <div class="heart">💗</div>
  <div class="heart">💖</div>
  <div class="heart">💞</div>


  <div class="page">

    <h1>Hey Chiquis 💕</h1>

    <div class="intro">
      I made you a little something
    </div>


    <button
      id="surpriseButton"
      class="surprise-button"
      onclick="showSurprise()"
    >
      For Chiquis Only ❤️
    </button>


    <div
      class="surprise"
      id="surprise"
    >

      <div class="cat-container">

        <img
          class="cat"
          src="cat.gif"
          alt="Spinning meme cat"
        >

      </div>


      <div class="cake">

        <div class="frosting"></div>

      </div>


      <div class="love">

        I love you CHIQUI BABY ❤️

      </div>


      <div class="message">

        Have a good day every day 💕

      </div>

    </div>

  </div>


  <!-- MUSIC LOADS HERE AFTER BUTTON IS PRESSED -->

  <div id="musicContainer"></div>


  <script>

    let musicStarted = false;


    function showSurprise() {

      const surprise =
        document.getElementById("surprise");

      const button =
        document.getElementById("surpriseButton");


      /* Show surprise */

      surprise.classList.add("show");


      /* Change button */

      button.innerHTML = "I love you amor ❤️";


      /* Start music only once */

      if (!musicStarted) {

        musicStarted = true;

        const player =
          document.createElement("iframe");


        player.id = "musicPlayer";

        player.src =
          "https://www.youtube.com/embed/IxX_QHay02M?autoplay=1&loop=1&playlist=IxX_QHay02M&controls=0&rel=0";


        player.allow =
          "autoplay; encrypted-media";


        player.setAttribute(
          "allowfullscreen",
          ""
        );


        document
          .getElementById("musicContainer")
          .appendChild(player);

      }

    }

  </script>

</body>

</html>
