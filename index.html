<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>For Chiquis ❤️</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Arial Rounded MT Bold", Arial, sans-serif;

      background:
        radial-gradient(circle at top, #fff8fc, #ffd7e7);

      display: flex;
      justify-content: center;
      align-items: center;

      overflow: hidden;
    }

    .page {
      text-align: center;
      width: 100%;
      max-width: 430px;
      padding: 30px 20px 60px;
    }

    h1 {
      color: #d94f7d;
      font-size: 34px;
      margin-bottom: 12px;
    }

    .intro {
      color: #a84d6c;
      font-size: 18px;
      margin-bottom: 35px;
    }

    .surprise-button {
      border: none;
      padding: 17px 30px;
      background: #e85c8c;
      color: white;
      font-size: 19px;
      font-weight: bold;
      border-radius: 30px;

      box-shadow:
        0 8px 20px rgba(180, 55, 100, 0.25);

      cursor: pointer;
      animation: pulse 1.5s infinite;
    }

    .surprise {
      display: none;
      margin-top: 28px;
    }

    .surprise.show {
      display: block;
      animation: fadeUp 0.8s ease;
    }

    .cat-container {
      height: 185px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .cat {
      width: 155px;
      max-height: 155px;
      object-fit: contain;
      border-radius: 18px;

      animation:
        catBounce 0.7s ease-in-out infinite alternate;

      filter:
        drop-shadow(0 10px 12px rgba(0, 0, 0, 0.15));
    }

    .cake {
      margin: -20px auto 25px;
      width: 240px;
      height: 115px;
      background: #f48fb1;
      border-radius: 20px 20px 28px 28px;
      position: relative;

      box-shadow:
        inset 0 -12px rgba(175, 40, 90, 0.12),
        0 12px 20px rgba(100, 30, 60, 0.12);
    }

    .frosting {
      position: absolute;
      top: 0;
      width: 100%;
      height: 40px;
      background: #fff8fa;
      border-radius: 50%;
    }

    .frosting::after {
      content: "";
      position: absolute;
      width: 35px;
      height: 40px;
      background: #fff8fa;
      border-radius: 0 0 50% 50%;
      top: 18px;
      left: 30px;

      box-shadow:
        65px 4px #fff8fa,
        130px 0 #fff8fa;
    }

    .love {
      font-size: 33px;
      font-weight: bold;
      color: #d6336c;
      margin-top: 18px;
      animation: lovePop 1s ease;
    }

    .message {
      font-size: 21px;
      line-height: 1.5;
      color: #9d4162;
      margin-top: 15px;
    }

    .heart {
      position: fixed;
      bottom: -50px;
      font-size: 28px;
      animation: hearts 6s linear infinite;
      pointer-events: none;
    }

    .heart:nth-child(1) {
      left: 8%;
      animation-delay: 0s;
    }

    .heart:nth-child(2) {
      left: 25%;
      animation-delay: 1.5s;
    }

    .heart:nth-child(3) {
      left: 48%;
      animation-delay: 3s;
    }

    .heart:nth-child(4) {
      left: 70%;
      animation-delay: 0.7s;
    }

    .heart:nth-child(5) {
      left: 88%;
      animation-delay: 2.2s;
    }

    /*
      Keep the YouTube player loaded,
      but move it almost completely off screen.
    */

    #player-holder {
      position: fixed;
      width: 2px;
      height: 2px;
      left: -10px;
      bottom: -10px;
      overflow: hidden;
      opacity: 0.01;
    }

    @keyframes hearts {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
      }

      20% {
        opacity: 1;
      }

      100% {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
      }
    }

    @keyframes pulse {
      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.06);
      }

      100% {
        transform: scale(1);
      }
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes catBounce {
      from {
        transform: translateY(0);
      }

      to {
        transform: translateY(-12px);
      }
    }

    @keyframes lovePop {
      0% {
        transform: scale(0.5);
        opacity: 0;
      }

      70% {
        transform: scale(1.12);
      }

      100% {
        transform: scale(1);
        opacity: 1;
      }
    }
  </style>
</head>

<body>

  <div class="heart">❤️</div>
  <div class="heart">💕</div>
  <div class="heart">💗</div>
  <div class="heart">💖</div>
  <div class="heart">💞</div>

  <div class="page">

    <h1>Hey Chiquis 💕</h1>

    <div class="intro">
      I made you a something bc i couldnt sleep
    </div>

    <button
      id="surpriseButton"
      class="surprise-button"
      onclick="showSurprise()"
    >
      For Chiqui Baby Only ❤️
    </button>

    <div
      class="surprise"
      id="surprise"
    >

      <div class="cat-container">

        <img
          class="cat"
          src="https://media.giphy.com/media/1c9ltJnlPKZ4jhDRpw/giphy.gif"
          alt="Spinning meme cat"
        >

      </div>

      <div class="cake">
        <div class="frosting"></div>
      </div>

      <div class="love">
        I love you CHIQUIS ❤️
      </div>

      <div class="message">
        Have a good day every day 💕
      </div>

    </div>

  </div>

  <!-- YouTube player loads BEFORE she presses the button -->

  <div id="player-holder">
    <div id="player"></div>
  </div>


  <!-- YouTube Player API -->

  <script src="https://www.youtube.com/iframe_api"></script>


  <script>

    let player;
    let playerReady = false;


    /*
      YouTube automatically calls this
      when the player API finishes loading.
    */

    function onYouTubeIframeAPIReady() {

      player = new YT.Player("player", {

        height: "200",
        width: "200",

        videoId: "IxX_QHay02M",

        playerVars: {

          playsinline: 1,

          controls: 0,

          rel: 0,

          loop: 1,

          playlist: "IxX_QHay02M"

        },

        events: {

          onReady: function () {

            playerReady = true;

          }

        }

      });

    }


    function showSurprise() {

      const surprise =
        document.getElementById("surprise");

      const button =
        document.getElementById("surpriseButton");


      /*
        Reveal everything
      */

      surprise.classList.add("show");


      /*
        Change button text
      */

      button.innerHTML =
        "I love you amor ❤️";


      /*
        Start YouTube directly from her tap
      */

      if (playerReady && player) {

        player.unMute();

        player.setVolume(100);

        player.playVideo();

      }

    }

  </script>

</body>
</html>
