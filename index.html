<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>A Little Surprise ❤️</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;

      font-family: "Arial Rounded MT Bold", Arial, sans-serif;

      background: linear-gradient(
        135deg,
        #ffd6e7,
        #ffeef5,
        #ffd9e8
      );
    }

    .container {
      text-align: center;
      position: relative;
    }

    h1 {
      color: #d94f7d;
      font-size: 30px;
      margin-bottom: 60px;
      animation: fadeIn 1.5s ease;
    }

    /* CAKE */

    .cake {
      position: relative;
      width: 230px;
      height: 150px;
      margin: auto;
    }

    .cake-bottom {
      position: absolute;
      bottom: 0;

      width: 230px;
      height: 100px;

      background: #ff8fb1;

      border-radius: 15px 15px 25px 25px;

      box-shadow:
        inset 0 -12px rgba(190, 60, 100, 0.15),
        0 10px 20px rgba(120, 40, 70, 0.15);
    }

    .frosting {
      position: absolute;

      width: 230px;
      height: 42px;

      bottom: 80px;

      background: #fff4f7;

      border-radius: 50% 50% 30% 30%;
    }

    .frosting::after {
      content: "";

      position: absolute;

      width: 35px;
      height: 40px;

      background: #fff4f7;

      border-radius: 0 0 50% 50%;

      top: 20px;
      left: 35px;

      box-shadow:
        60px 5px #fff4f7,
        125px -2px #fff4f7;
    }

    /* KITTY */

    .kitty {
      position: absolute;

      left: 50%;
      bottom: 70px;

      transform: translateX(-50%) translateY(100px);

      font-size: 100px;

      opacity: 0;

      z-index: -1;

      animation: kittyPop 2s ease forwards;
      animation-delay: 1.5s;
    }

    /* HEARTS */

    .heart {
      position: fixed;

      bottom: -40px;

      font-size: 25px;

      animation: floatHeart 5s linear infinite;

      opacity: 0.8;
    }

    .heart:nth-child(1) {
      left: 10%;
      animation-delay: 0s;
    }

    .heart:nth-child(2) {
      left: 25%;
      animation-delay: 2s;
    }

    .heart:nth-child(3) {
      left: 45%;
      animation-delay: 1s;
    }

    .heart:nth-child(4) {
      left: 65%;
      animation-delay: 3s;
    }

    .heart:nth-child(5) {
      left: 85%;
      animation-delay: 1.5s;
    }

    /* MESSAGE */

    .love-message {
      margin-top: 40px;

      font-size: 34px;

      color: #d6336c;

      opacity: 0;

      transform: scale(0.5);

      animation: messageAppear 1s ease forwards;

      animation-delay: 3.2s;
    }

    .little-message {
      color: #a83c60;

      font-size: 18px;

      margin-top: 15px;

      opacity: 0;

      animation: fadeIn 1.5s ease forwards;

      animation-delay: 4s;

      max-width: 350px;

      padding: 0 20px;
    }

    /* ANIMATIONS */

    @keyframes kittyPop {
      0% {
        transform: translateX(-50%) translateY(100px);
        opacity: 0;
      }

      60% {
        transform: translateX(-50%) translateY(-60px);
        opacity: 1;
      }

      80% {
        transform: translateX(-50%) translateY(-40px);
      }

      100% {
        transform: translateX(-50%) translateY(-55px);
        opacity: 1;
        z-index: 2;
      }
    }

    @keyframes messageAppear {
      0% {
        opacity: 0;
        transform: scale(0.5);
      }

      70% {
        transform: scale(1.1);
      }

      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes floatHeart {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
      }

      20% {
        opacity: 1;
      }

      100% {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @media(max-width: 500px) {

      h1 {
        font-size: 25px;
      }

      .love-message {
        font-size: 30px;
      }

      .kitty {
        font-size: 90px;
      }
    }

  </style>
</head>

<body>

  <div class="heart">❤️</div>
  <div class="heart">💕</div>
  <div class="heart">💗</div>
  <div class="heart">❤️</div>
  <div class="heart">💖</div>

  <div class="container">

    <h1>I have a little surprise for you...</h1>

    <div class="cake">

      <div class="kitty">
        🐱
      </div>

      <div class="cake-bottom"></div>

      <div class="frosting"></div>

    </div>

    <div class="love-message">
      I love you ❤️
    </div>

    <div class="little-message">
      You make my days better just by being in them.
      I'm lucky to have you. 💕
    </div>

  </div>

</body>
</html>
